name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: zig cc -target x86_64-linux-gnu
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: zig cc -target aarch64-linux-gnu
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: zig cc -target x86_64-windows-gnu
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang -arch arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Zig
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          readonly ZIG_VERSION="0.15.2"
          readonly INSTALL_DIR="${RUNNER_TEMP}/zig"

          case "${{ matrix.goarch }}" in
            amd64)
              readonly ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              readonly ZIG_SHA256="02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
              ;;
            arm64)
              readonly ZIG_ARCHIVE="zig-aarch64-linux-${ZIG_VERSION}.tar.xz"
              readonly ZIG_SHA256="958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f"
              ;;
            *)
              echo "unsupported goarch for Zig install: ${{ matrix.goarch }}" >&2
              exit 1
              ;;
          esac

          readonly ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"

          curl -fsSL "${ZIG_URL}" -o "${RUNNER_TEMP}/${ZIG_ARCHIVE}"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/${ZIG_ARCHIVE}" | sha256sum -c -

          rm -rf "${INSTALL_DIR}"
          tar -xJf "${RUNNER_TEMP}/${ZIG_ARCHIVE}" -C "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/${ZIG_ARCHIVE%.tar.xz}" "${INSTALL_DIR}"

          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          "${INSTALL_DIR}/zig" version

      - name: Build release archive
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release-artifact.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${TARGET}" \
            --jq '.body' > generated-release-notes.md

          cat .github/release-notes-header.md > release-notes.md
          printf '\n\n## Changelog\n\n' >> release-notes.md
          cat generated-release-notes.md >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="gx ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "${title}" --notes-file release-notes.md
            exit 0
          fi

          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${title}" \
            --notes-file release-notes.md
