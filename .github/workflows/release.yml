name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: zig cc -target x86_64-linux-gnu
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: zig cc -target aarch64-linux-gnu
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: zig cc -target x86_64-windows-gnu
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang -arch arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2

      - name: Build release archive
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release-artifact.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${TARGET}" \
            --jq '.body' > generated-release-notes.md

          cat .github/release-notes-header.md > release-notes.md
          printf '\n\n## Changelog\n\n' >> release-notes.md
          cat generated-release-notes.md >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="gx ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "${title}" --notes-file release-notes.md
            exit 0
          fi

          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${title}" \
            --notes-file release-notes.md
